<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Camera Test - 后置摄像头</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    video {
      width: 90%;
      max-width: 480px;
      border-radius: 8px;
      border: 2px solid #00c6ff;
    }
    button {
      position: absolute;
      bottom: 20px;
      padding: 8px 16px;
      background: #00c6ff;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <video id="preview" autoplay playsinline></video>
  <button id="switch">切换镜头</button>

  <script>
    let usingBack = true; // 当前是否用后置
    let currentStream;

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: { facingMode: usingBack ? { exact: "environment" } : "user" },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        const video = document.getElementById('preview');
        video.srcObject = stream;
      } catch (err) {
        alert('无法访问摄像头: ' + err.message);
        console.error(err);
      }
    }

    document.getElementById('switch').addEventListener('click', () => {
      usingBack = !usingBack;
      startCamera();
    });

    startCamera();
  </script>
</body>
</html>
